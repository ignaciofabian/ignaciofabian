<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
  <title id="title">Ignacio Fabian - Developer Banner</title>
  <desc id="desc">Animated futuristic developer banner with code, terminal and microservices.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#090718"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc">
        <animate attributeName="stop-color"
                 values="#7dd3fc;#22d3ee;#a78bfa;#7dd3fc"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color"
                 values="#38bdf8;#818cf8;#22d3ee;#38bdf8"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color"
                 values="#c084fc;#60a5fa;#e879f9;#c084fc"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".16"/>
      <stop offset="65%" stop-color="#7c3aed" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28"
            fill="none" stroke="#38bdf8"
            stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <clipPath id="leftPanelClip">
      <rect x="34" y="56" width="280" height="220" rx="18"/>
    </clipPath>

    <clipPath id="rightPanelClip">
      <rect x="886" y="52" width="280" height="224" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="168" rx="420" ry="220" fill="url(#centerGlow)">
    <animate attributeName="rx" values="390;450;390" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;1;.65" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ambient scanning lines -->
  <g opacity=".24">
    <rect x="-260" y="0" width="220" height="360" fill="url(#lineGrad)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1320" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="0" width="120" height="360" fill="url(#lineGrad)" opacity=".35" transform="skewX(-18)">
      <animate attributeName="x" values="-400;1400" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating particles -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="94" cy="32" r="2">
      <animate attributeName="cy" values="32;18;32" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="366" cy="48" r="1.8">
      <animate attributeName="cy" values="48;30;48" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.9;.1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="802" cy="36" r="2">
      <animate attributeName="cy" values="36;20;36" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;1;.15" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="28" r="1.6">
      <animate attributeName="cy" values="28;44;28" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#a855f7" filter="url(#glow)">
    <circle cx="230" cy="324" r="1.7">
      <animate attributeName="cy" values="324;304;324" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="748" cy="318" r="2">
      <animate attributeName="cy" values="318;298;318" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1044" cy="326" r="1.8">
      <animate attributeName="cy" values="326;308;326" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left developer panel -->
  <rect x="34" y="56" width="280" height="220" rx="18"
        fill="#06101f" fill-opacity=".88"
        stroke="#22d3ee" stroke-opacity=".45"/>
  <rect x="34" y="56" width="280" height="220" rx="18"
        fill="none" stroke="#22d3ee" stroke-opacity=".2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".15;.55;.15" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#leftPanelClip)">
    <rect x="34" y="56" width="280" height="34" fill="#0a1628"/>
    <circle cx="54" cy="73" r="4" fill="#fb7185"/>
    <circle cx="68" cy="73" r="4" fill="#facc15"/>
    <circle cx="82" cy="73" r="4" fill="#4ade80"/>
    <text x="101" y="77" fill="#7dd3fc" font-size="11"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">developer.py</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="11">
      <text x="54" y="110" fill="#c084fc">class</text>
      <text x="89" y="110" fill="#7dd3fc">Developer:</text>

      <text x="66" y="130" fill="#c084fc">def</text>
      <text x="91" y="130" fill="#7dd3fc">build(self):</text>

      <text x="78" y="150" fill="#94a3b8">code =</text>
      <text x="126" y="150" fill="#67e8f9">solve_problem()</text>

      <text x="78" y="170" fill="#94a3b8">test(code)</text>
      <text x="78" y="190" fill="#94a3b8">deploy(code)</text>

      <text x="78" y="210" fill="#94a3b8">return</text>
      <text x="125" y="210" fill="#86efac">"impact"</text>

      <text x="54" y="244" fill="#34d399">$ git push origin main</text>

      <rect x="54" y="254" width="8" height="14" rx="1" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="34" y="56" width="100" height="220" fill="url(#lineGrad)" opacity=".08">
      <animate attributeName="x" values="-80;330" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right architecture panel -->
  <rect x="886" y="52" width="280" height="224" rx="18"
        fill="#06101f" fill-opacity=".88"
        stroke="#8b5cf6" stroke-opacity=".42"/>
  <rect x="886" y="52" width="280" height="224" rx="18"
        fill="none" stroke="#8b5cf6" stroke-opacity=".15" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".12;.5;.12" dur="4.6s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#rightPanelClip)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="904" y="78" fill="#c4b5fd" font-size="11">SYSTEM_ARCHITECTURE</text>

    <rect x="974" y="91" width="102" height="28" rx="7"
          fill="#0b1c33" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="1025" y="109" text-anchor="middle" fill="#67e8f9" font-size="10">API GATEWAY</text>

    <path d="M1025 119 V137 M932 137 H1116"
          fill="none" stroke="#38bdf8" stroke-opacity=".65"
          stroke-width="1.3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <g font-size="8.5" text-anchor="middle">
      <rect x="906" y="140" width="54" height="45" rx="7" fill="#081827" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="933" y="158" fill="#7dd3fc">USER</text>
      <text x="933" y="171" fill="#7dd3fc">SERVICE</text>

      <rect x="970" y="140" width="54" height="45" rx="7" fill="#081827" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="997" y="158" fill="#7dd3fc">AUTH</text>
      <text x="997" y="171" fill="#7dd3fc">SERVICE</text>

      <rect x="1034" y="140" width="54" height="45" rx="7" fill="#081827" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="1061" y="158" fill="#c4b5fd">BOOK</text>
      <text x="1061" y="171" fill="#c4b5fd">SERVICE</text>

      <rect x="1098" y="140" width="54" height="45" rx="7" fill="#081827" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="1125" y="158" fill="#c4b5fd">LOAN</text>
      <text x="1125" y="171" fill="#c4b5fd">SERVICE</text>
    </g>

    <path d="M933 185 V204 H1125 V185"
          fill="none" stroke="#8b5cf6" stroke-opacity=".55"
          stroke-width="1.3" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" values="18;0" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <rect x="934" y="211" width="88" height="27" rx="6"
          fill="#0b1b2e" stroke="#22d3ee" stroke-opacity=".45"/>
    <text x="978" y="228" text-anchor="middle" fill="#67e8f9" font-size="9">POSTGRESQL</text>

    <rect x="1032" y="211" width="88" height="27" rx="6"
          fill="#0b1b2e" stroke="#a78bfa" stroke-opacity=".45"/>
    <text x="1076" y="228" text-anchor="middle" fill="#c4b5fd" font-size="9">DOCKER</text>

    <circle cx="1144" cy="224" r="5" fill="#22d3ee">
      <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central icon -->
  <g transform="translate(600 64)">
    <path d="M-48 -25 L0 -50 L48 -25 V25 L0 50 L-48 25 Z"
          fill="#071426" fill-opacity=".72"
          stroke="#22d3ee" stroke-opacity=".6">
      <animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="10" text-anchor="middle" fill="#67e8f9"
          font-size="34" font-weight="800"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          filter="url(#glow)">&lt;/&gt;</text>
  </g>

  <!-- Main title -->
  <text x="600" y="177" text-anchor="middle"
        fill="url(#nameGrad)" font-size="62" font-weight="800"
        letter-spacing="-1"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        filter="url(#glow)">
    Ignacio Fabian
    <animate attributeName="opacity" values=".92;1;.92" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <rect x="381" y="196" width="438" height="2.2" rx="1"
        fill="url(#lineGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="225" text-anchor="middle"
        fill="#cbd5e1" font-size="14" letter-spacing="4"
        font-family="Inter, Segoe UI, Arial, sans-serif">
    DEVELOPER • ENGINEER • PROBLEM SOLVER
  </text>

  <!-- Skill pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="10" text-anchor="middle">
    <g transform="translate(420 253)">
      <rect x="-44" y="-13" width="88" height="26" rx="13"
            fill="#082033" stroke="#22d3ee" stroke-opacity=".45"/>
      <text y="4" fill="#67e8f9">JAVA</text>
    </g>
    <g transform="translate(516 253)">
      <rect x="-44" y="-13" width="88" height="26" rx="13"
            fill="#082033" stroke="#22d3ee" stroke-opacity=".45"/>
      <text y="4" fill="#67e8f9">SPRING</text>
    </g>
    <g transform="translate(612 253)">
      <rect x="-44" y="-13" width="88" height="26" rx="13"
            fill="#12152d" stroke="#a78bfa" stroke-opacity=".55"/>
      <text y="4" fill="#c4b5fd">DOCKER</text>
    </g>
    <g transform="translate(708 253)">
      <rect x="-44" y="-13" width="88" height="26" rx="13"
            fill="#12152d" stroke="#a78bfa" stroke-opacity=".55"/>
      <text y="4" fill="#c4b5fd">POSTGRES</text>
    </g>
    <g transform="translate(804 253)">
      <rect x="-44" y="-13" width="88" height="26" rx="13"
            fill="#082033" stroke="#22d3ee" stroke-opacity=".45"/>
      <text y="4" fill="#67e8f9">GIT</text>
    </g>
  </g>

  <!-- Animated data wave -->
  <g transform="translate(0 314)">
    <path d="M0 20 C90 -8 160 38 250 14 S420 -2 520 20 S700 42 820 12 S1010 -4 1200 20"
          fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5">
      <animate attributeName="d"
        values="
        M0 20 C90 -8 160 38 250 14 S420 -2 520 20 S700 42 820 12 S1010 -4 1200 20;
        M0 16 C90 36 160 -8 250 18 S420 40 520 14 S700 -4 820 20 S1010 38 1200 16;
        M0 20 C90 -8 160 38 250 14 S420 -2 520 20 S700 42 820 12 S1010 -4 1200 20"
        dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 27 C120 4 210 44 330 22 S520 4 650 26 S860 44 970 18 S1120 8 1200 25"
          fill="none" stroke="#a855f7" stroke-opacity=".32" stroke-width="1.2">
      <animate attributeName="d"
        values="
        M0 27 C120 4 210 44 330 22 S520 4 650 26 S860 44 970 18 S1120 8 1200 25;
        M0 20 C120 43 210 6 330 26 S520 42 650 18 S860 4 970 28 S1120 40 1200 20;
        M0 27 C120 4 210 44 330 22 S520 4 650 26 S860 44 970 18 S1120 8 1200 25"
        dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Moving data nodes -->
  <g filter="url(#glow)">
    <circle r="3" fill="#67e8f9">
      <animateMotion dur="5s" repeatCount="indefinite"
        path="M34 297 C240 260 360 330 600 292 S960 260 1166 298"/>
    </circle>
    <circle r="2.5" fill="#c084fc">
      <animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite"
        path="M1166 302 C980 272 840 326 600 294 S250 272 34 304"/>
    </circle>
  </g>

  <!-- Border pulse -->
  <rect x="2" y="2" width="1196" height="356" rx="22"
        fill="none" stroke="#38bdf8" stroke-opacity=".12">
    <animate attributeName="stroke-opacity" values=".08;.28;.08" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
